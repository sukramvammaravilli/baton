<!DOCTYPE html>
<html>
<head>
    <title>Wallet System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container mt-5">

    <h2 class="mb-4">Multi Currency Wallet</h2>

    <div class="card p-4 mb-4">

        <h4>Transfer Money</h4>

        <input class="form-control mb-2" id="fromAccount" placeholder="From Account">

        <input class="form-control mb-2" id="toAccount" placeholder="To Account">

        <input class="form-control mb-2" id="amount" placeholder="Amount">

        <input class="form-control mb-2" id="currency" placeholder="Currency">

        <button class="btn btn-primary" onclick="transferMoney()">
            Transfer
        </button>
    </div>

    <div class="card p-4">

        <h4>Transactions</h4>

        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Currency</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="transactionTable"></tbody>
        </table>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>







<!DOCTYPE html>
<html>
<head>

    <title>
        Wallet Dashboard
    </title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

<div class="container">

    <h1>
        Multi Currency Wallet
    </h1>

    <button
        class="logout-btn"
        onclick="logout()">

        Logout

    </button>

    <div class="card">

        <h3>
            Deposit Money
        </h3>

        <input
            id="depositAccount"
            placeholder="Account Number">

        <input
            id="depositAmount"
            type="number"
            step="0.001"
            placeholder="Amount">

        <input
            id="depositCurrency"
            placeholder="Currency">

        <button
            onclick="deposit()">

            Deposit

        </button>

    </div>

    <div class="card">

        <h3>
            Transfer Money
        </h3>

        <input
            id="fromAccount"
            placeholder="From Account">

        <input
            id="toAccount"
            placeholder="To Account">

        <input
            id="transferAmount"
            type="number"
            step="0.001"
            placeholder="Amount">

        <input
            id="transferCurrency"
            placeholder="Currency">

        <button
            onclick="transfer()">

            Transfer

        </button>

    </div>

    <div class="card">

        <h3>
            Transaction History
        </h3>

        <button
            onclick="loadTransactions()">

            Refresh

        </button>

        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Currency</th>
                    <th>Date</th>

                </tr>

            </thead>

            <tbody
                id="transactions">

            </tbody>

        </table>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
