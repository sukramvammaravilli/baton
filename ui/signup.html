<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Sign Up</title>

<link rel="stylesheet" href="style.css">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

</head>

<body>

<div class="wrapper">

    <div class="card">

        <h1>Sign Up</h1>

        <form id="signupForm">

            <div class="input-box">

                <label>Username</label>

                <div class="input-group">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        id="username"
                        required>

                </div>

            </div>

            <div class="input-box">

                <label>Full Name</label>

                <div class="input-group">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        id="fullname"
                        required>

                </div>

            </div>

            <div class="input-box">

                <label>Password</label>

                <div class="input-group">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        required>

                </div>

            </div>

            <button
                type="submit"
                class="btn">

                REGISTER

            </button>

            <p id="message"></p>

            <div class="signup-link">

                Already have account?

                <a href="login.html">
                    Login
                </a>

            </div>

        </form>

    </div>

</div>

<script>

document
.getElementById('signupForm')
.addEventListener('submit', async(e)=>{

    e.preventDefault();

    const response =
        await fetch('/api/register',{

            method:'POST',

            headers:{
                'Content-Type':'application/json'
            },

            body:JSON.stringify({

                username:
                document.getElementById(
                    'username'
                ).value,

                fullname:
                document.getElementById(
                    'fullname'
                ).value,
                
                password:
                document.getElementById(
                    'password'
                ).value
            })
        });

    const data =
        await response.json();

    document.getElementById(
        'message'
    ).innerText =
    data.message ||
    data.error;

});

</script>

</body>
</html>
