<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>
<link rel="stylesheet" href="style.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
</head>
<body>
<div class="wrapper">
    <div class="card">
        <h1>Sign Up</h1>
        <form id="signupForm" class="signup-grid">
            <div class="grid-row">
    <div class="input-box">
        <label>Username</label>
        <div class="input-group">
            <i class="fa-solid fa-user"></i>
            <input
                type="text"
                id="username"
                placeholder="Enter Username"
                required>
        </div>
    </div>
    <div class="input-box">
        <label>Full Name</label>
        <div class="input-group">
            <i class="fa-solid fa-id-card"></i>
            <input
                type="text"
                id="fullname"
                placeholder="Enter Full Name"
                >
        </div>
    </div>
    </div>
<div class="grid-row">
    <div class="input-box">
        <label>Mobile Number</label>
        <div class="input-group">
            <input
    type="tel"
    id = "mobile"
    name="mobile"
    placeholder="Enter Mobile Number with country code"
    pattern="^\+[1-9]\d{1,14}$"
    required>
        </div>
    </div>
    <div class="input-box">
        <label>PAN / National ID</label>
        <div class="input-group">
            <i class="fa-solid fa-address-card"></i>
            <input
                type="text"
                id="identityNumber"
                placeholder="Enter PAN or National ID"
                required>
        </div>
</div>
    </div>
    <div class="input-box">
        <label>Email Address</label>
        <div class="input-group">
            <i class="fa-solid fa-envelope"></i>
            <input
                type="email"
                id="email"
                placeholder="Enter Email"
                required>
        </div>
    </div>
    
    <div class="input-box">

    <label>Password</label>

    <div class="input-group">

        <i class="fa-solid fa-lock"></i>

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
            required>

    </div>
    
    <div class="password-rules">

        <p id="rule-length" class="invalid">
            Minimum 8 characters
        </p>

        <p id="rule-upper" class="invalid">
            Atleast one uppercase letter
        </p>

        <p id="rule-lower" class="invalid">
            Atleast one lowercase letter
        </p>

        <p id="rule-number" class="invalid">
            Atleast one number
        </p>

        <p id="rule-symbol" class="invalid">
            Atleast one special character
        </p>

    </div>

</div>
    <button
        type="submit"
        class="btn">
        REGISTER
    </button>
    <p id="message"></p>
    <div class="signup-link">
        Already have account?
        <a href="index.html">
            Login
        </a>
    </div>
</form>
    </div>
</div>
<div id="toast" class="toast"></div>
<script  src="signup.js"></script>
</body>
</html>
